name: Build Android APK

on:
  push:
    branches:
      - release
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      API_URL: ${{ secrets.API_URL }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PUSHER_APP_KEY: ${{ secrets.PUSHER_APP_KEY }}
      PUSHER_APP_CLUSTER: ${{ secrets.PUSHER_APP_CLUSTER }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.0
          cache: true

      - name: Decode keystore and create key.properties
        run: |
          if [ -n "${KEYSTORE_BASE64:-}" ] && [ -n "${KEYSTORE_PASSWORD:-}" ]; then
            mkdir -p mobile/android/app
            echo "$KEYSTORE_BASE64" | base64 --decode > mobile/android/app/keystore.jks
            {
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyPassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=upload"
              echo "storeFile=keystore.jks"
            } > mobile/android/key.properties
            echo "Keystore written to mobile/android/app/keystore.jks and key.properties created"
          else
            echo "KEYSTORE_BASE64 or KEYSTORE_PASSWORD not set - skipping keystore setup"
          fi

      - name: Get dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build APK
        working-directory: mobile
        run: flutter build apk --release --target-platform=android-arm64 --dart-define="BASE_URL=${API_URL:-}" --dart-define="PUSHER_APP_KEY=${PUSHER_APP_KEY:-}" --dart-define="PUSHER_APP_CLUSTER=${PUSHER_APP_CLUSTER:-mt1}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: mobile/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      - name: Upload to Telegram
        run: |
          APK_PATH="mobile/build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "APK not found at $APK_PATH, skipping Telegram upload"
            exit 0
          fi

          if [ -n "${TELEGRAM_BOT_TOKEN:-}" ] && [ -n "${TELEGRAM_CHAT_ID:-}" ]; then
            curl -s -F document=@"$APK_PATH" \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument?chat_id=${TELEGRAM_CHAT_ID}" \
              -o /tmp/telegram_response.json
            cat /tmp/telegram_response.json
          else
            echo "TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID not set - skipping Telegram upload"
          fi

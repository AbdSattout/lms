      "blockContent": "## What is Object-Oriented Programming?\n\nObject-Oriented Programming, or OOP, is a programming style that organizes code around objects.\n\nAn object combines two main things:\n\n- **Data**, also called attributes or fields.\n- **Behavior**, also called methods or functions.\n\nFor example, in a learning management system, a `Course` can be represented as an object. It may have data such as `title`, `description`, and `status`. It may also have behavior such as `publishCourse()` or `updateCourse()`.\n\nOOP helps developers write cleaner code because related data and behavior are kept together. It also makes large systems easier to maintain, extend, and understand."

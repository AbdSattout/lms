description: |-
  Returns the authenticated user's default scoreboard.

  Default period is WEEKLY.

  The response contains:
  - period
  - from / to date range
  - leaders: top ranked users for the selected period
  - me: current user's rank, even if they are not inside the visible leaders limit

  Example response:
  {
    "period": "WEEKLY",
    "from": "2026-07-13",
    "to": "2026-07-19",
    "leaders": [
      {
        "rank": 1,
        "userId": 1,
        "name": "Demo Student",
        "picture": null,
        "xp": 300,
        "levelNumber": 5,
        "levelTitle": "Apprentice"
      }
    ],

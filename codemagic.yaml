workflows:
  build-apk:
    name: Build Android APK
    max_build_duration: 30
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "release"
          include: true
          source: true
    environment:
      flutter: 3.35.7
      groups:
        - default
    scripts:
      - name: Decode Keystore and create key.properties
        script: |
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            mkdir -p mobile/android/app
            echo "$KEYSTORE_BASE64" | base64 --decode > mobile/android/app/keystore.jks
            echo "storePassword=$KEYSTORE_PASSWORD" > mobile/android/key.properties
            echo "keyPassword=$KEYSTORE_PASSWORD" >> mobile/android/key.properties
            echo "keyAlias=upload" >> mobile/android/key.properties
            echo "storeFile=keystore.jks" >> mobile/android/key.properties
            echo "Keystore written to mobile/android/app/keystore.jks and key.properties created"
          else
            echo "KEYSTORE_BASE64 not set — skipping keystore setup"
          fi
      - name: Get dependencies
        script: |
          cd mobile
          flutter pub get
      - name: Build APK
        script: |
          cd mobile
          flutter build apk --release --target-platform=android-arm64
      - name: Upload to Telegram
        script: |
          APK_PATH="mobile/build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "APK not found at $APK_PATH, skipping Telegram upload"
            exit 0
          fi
          if [ -n "${TELEGRAM_BOT_TOKEN:-}" ] && [ -n "${TELEGRAM_CHAT_ID:-}" ]; then
            curl -s -F document=@"$APK_PATH" "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument?chat_id=${TELEGRAM_CHAT_ID}" \
              -o /tmp/telegram_response.json
            cat /tmp/telegram_response.json
          else
            echo "TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID not set — skipping Telegram upload"
          fi
    artifacts:
      - mobile/build/app/outputs/flutter-apk/*.apk
